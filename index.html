<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>SnapText</title>
<meta name="description" content="Snap a screenshot, tap the words, copy." />
<meta name="theme-color" content="#0a0a0c" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="SnapText" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" type="image/svg+xml" href="icon.svg" />
<link rel="apple-touch-icon" href="icon-192.png" />
<link rel="stylesheet" href="styles.css" />
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
</head>
<body>
  <header class="bar">
    <div class="brand"><span class="mark"><svg viewBox="0 0 24 24" width="17" height="17" fill="currentColor" aria-hidden="true"><path d="M12 2.5c.8 5.2 3.3 7.7 8.5 8.5-5.2.8-7.7 3.3-8.5 8.5-.8-5.2-3.3-7.7-8.5-8.5 5.2-.8 7.7-3.3 8.5-8.5z"/></svg></span><span>snaptext</span></div>
    <div class="bar-right">
      <button id="installBtn" class="iconbtn hidden" aria-label="Install app"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v10"/><path d="M7.5 10.5 12 15l4.5-4.5"/><path d="M5 19.5h14"/></svg></button>
      <button id="resetBtn" class="iconbtn hidden" aria-label="New image"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14"/><path d="M5 12h14"/></svg></button>
    </div>
  </header>

  <main class="phone">
    <!-- ── Start ── -->
    <section id="uploadView" class="start">
      <p class="eyebrow">Private · on-device OCR</p>
      <button id="dropzone" class="hero" aria-label="Add screenshot">
        <span class="hero-icon"><svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="14" rx="4"/><circle cx="9" cy="10" r="1.7"/><path d="M4.5 17.5 10 12l3.2 3.2 3-3L19.5 16"/></svg></span>
        <span class="hero-title">Snap it. Copy it.</span>
        <span class="hero-sub">Add a screenshot — then tap its words</span>
      </button>
      <input id="fileInput" type="file" accept="image/*" hidden />
      <div class="start-row">
        <button id="pasteBtn" class="chip"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="4.5" width="12" height="16" rx="3.5"/><path d="M9.5 4.5V3h5v1.5"/><path d="M9.8 12h4.4M9.8 15.5h4.4"/></svg>paste</button>
        <button id="offlineBtn" class="chip dim">↓ offline</button>
      </div>
      <div class="or">or</div>
      <input id="numInput" class="numinput" type="tel" inputmode="tel" autocomplete="tel"
        placeholder="Paste a number to chat" aria-label="Type or paste a phone number" />
      <div id="numRow" class="phones hidden"></div>
      <p class="tiny">on-device · nothing uploads</p>
    </section>

    <!-- ── Work ── -->
    <section id="workView" class="hidden">
      <div class="tools">
        <div class="seg">
          <button id="modeClick" class="seg-btn active" aria-label="Tap words"><svg viewBox="0 0 24 24" width="17" height="17" fill="currentColor" aria-hidden="true"><path d="M6.5 3.8 19 11.6l-7.2 1.7-2.9 6.9z"/></svg></button>
          <button id="modeBox" class="seg-btn" aria-label="Drag box"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true"><rect x="4" y="6" width="16" height="12" rx="3.5" stroke-dasharray="4 3" stroke-linecap="round"/></svg></button>
        </div>
        <button id="eyeBtn" class="iconbtn on" aria-label="Toggle boxes"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 12S6 5.8 12 5.8 21.5 12 21.5 12 18 18.2 12 18.2 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="2.8"/></svg></button>
        <span class="flex"></span>
        <button id="selectAllBtn" class="toolbtn">all</button>
        <button id="clearBtn" class="toolbtn">clear</button>
        <button id="changeBtn" class="toolbtn">↺</button>
      </div>

      <div id="progressWrap" class="pload hidden"><div id="progressBar"></div></div>

      <div id="stage" class="stage">
        <img id="previewImg" alt="" draggable="false" />
        <div id="overlay" class="overlay show"></div>
        <div id="dragRect" class="drag-rect hidden"></div>
        <div id="hint" class="hint">tap words</div>
      </div>

      <div class="sheet">
        <div class="grab"></div>
        <div class="sheet-top">
          <span id="selCount" class="count">0</span>
          <span id="sheetLabel" class="sheet-label">nothing selected</span>
          <span class="flex"></span>
          <button id="copyAllBtn" class="toolbtn">all text →</button>
        </div>
        <pre id="selectedText" class="out hidden" contenteditable="true" spellcheck="false" enterkeyhint="done" aria-label="Selected text — tap to fix any mistakes"></pre>
        <pre id="fullText" class="out dim hidden"></pre>
        <div id="phoneRow" class="phones hidden"></div>
        <button id="copyBtn" class="cta" disabled>Copy</button>
      </div>
    </section>
  </main>

  <div id="toast" class="toast hidden">copied ✓</div>

<script src="app.js"></script>
</body>
</html>
